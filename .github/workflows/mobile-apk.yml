name: Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo prebuild -p android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Ephemeral per-run key: the APK is installable but has a signature
      # distinct from the EAS build, so it replaces, not updates, an existing
      # Vigil install.
      - name: Sign APK
        env:
          KEYSTORE_PASS: vigil-ci-signing
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keystore="$RUNNER_TEMP/vigil-ci.keystore"
          keytool -genkeypair -storetype PKCS12 -keystore "$keystore" \
            -alias vigil -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Vigil CI, O=jr4dh3y"
          unsigned="apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$build_tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/vigil-aligned.apk"
          "$build_tools/apksigner" sign --ks "$keystore" \
            --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEYSTORE_PASS" \
            --out "$RUNNER_TEMP/vigil-${GITHUB_SHA::7}.apk" "$RUNNER_TEMP/vigil-aligned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vigil-apk-${{ github.sha }}
          path: ${{ runner.temp }}/vigil-*.apk
          if-no-files-found: error
