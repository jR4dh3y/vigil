services:
  mediamtx:
    image: bluenviron/mediamtx:1.12.2
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - nvr-recordings:/var/lib/nvr/recordings
    restart: unless-stopped

  nvr:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Host networking simplifies WebRTC ICE on a LAN NVR box.
    network_mode: host
    environment:
      NVR_HTTP_ADDR: ":8080"
      NVR_DATA_DIR: /var/lib/nvr/data
      NVR_RECORDINGS_DIR: /var/lib/nvr/recordings
      NVR_RETENTION_DAYS: "7"
      NVR_MEDIAMTX_API_URL: http://127.0.0.1:9997
      NVR_MEDIAMTX_WEBRTC_URL: http://127.0.0.1:8889
      NVR_MEDIAMTX_HLS_URL: http://127.0.0.1:8888
      NVR_MEDIAMTX_PLAYBACK_URL: http://127.0.0.1:9996
      # NVR_SECRETS_KEY: set me in production
    volumes:
      - nvr-data:/var/lib/nvr/data
      - nvr-recordings:/var/lib/nvr/recordings
    depends_on:
      - mediamtx
    restart: unless-stopped

volumes:
  nvr-data:
  nvr-recordings:
  # --- RAM-staged recordings (optional) -------------------------------------
  # To stage recordings in RAM (zero persistent writes to disk when host swap
  # is disabled; segments are pushed to Google Drive as they complete and
  # evicted oldest-first under pressure), comment out the plain nvr-recordings
  # volume above and enable the tmpfs variant. Pair with
  # NVR_MAX_LOCAL_DWELL_MINUTES + NVR_LOCAL_EVICT_THRESHOLD on the nvr service.
  # Size tmpfs to leave headroom for the OS (e.g. 2-4g on an 8g box).
  # WARNING: everything unarchived is lost on reboot or daemon restart. If host
  # swap is enabled, tmpfs pages may be swapped to disk, persisting recordings.
  # nvr-recordings:
  #   driver_opts:
  #     type: tmpfs
  #     device: tmpfs
  #     o: size=3g
